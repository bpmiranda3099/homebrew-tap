name: Build bottles

# Builds prebuilt bottles for the formula's current version on macOS 26 (Apple
# silicon and Intel), attaches them to a release in this repo, and commits the
# bottle block to the formula. Run manually after bumping the formula.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  FORMULA: ai-usage-bar
  TAP: bpmiranda3099/tap

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        run: |
          version=$(sed -n 's#.*archive/refs/tags/v\(.*\)\.tar\.gz.*#\1#p' "Formula/${FORMULA}.rb")
          tag="${FORMULA}-${version}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$FORMULA $version" --notes "Bottles for $FORMULA $version."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  bottle:
    needs: release
    strategy:
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Build and upload bottle
        run: |
          tag="${{ needs.release.outputs.tag }}"
          brew tap "$TAP"
          brew install --build-bottle --build-from-source "$TAP/$FORMULA"
          brew bottle --json --root-url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag" "$TAP/$FORMULA"
          # GitHub release assets use a single dash where brew writes two.
          for f in *.bottle.tar.gz; do mv "$f" "${f/--/-}"; done
          gh release upload "$tag" ./*.bottle.tar.gz ./*.bottle.json --clobber -R "$GITHUB_REPOSITORY"

  publish:
    needs: [release, bottle]
    runs-on: macos-26
    steps:
      - name: Add bottle block to the formula
        run: |
          tag="${{ needs.release.outputs.tag }}"
          brew tap "$TAP"
          mkdir bottles
          gh release download "$tag" -p '*.json' -D bottles -R "$GITHUB_REPOSITORY"
          brew bottle --merge --write --no-commit bottles/*.json
          cd "$(brew --repository "$TAP")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          git commit -m "chore: add bottles for ${FORMULA} ${tag#${FORMULA}-}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
